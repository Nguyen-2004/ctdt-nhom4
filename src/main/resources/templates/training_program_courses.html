<!DOCTYPE html>
<html>
<head>
    <title>Training Program Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>Phân kỳ môn học</h1>
    <div class="container mt-4">
    <h2 class="mb-4 text-primary">Training Program Courses</h2>

    <form id="tpcForm" class="card p-4 shadow-sm">

        <div class="row">
        <!-- Training Program -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Training Program</label>
            <select id="trainingProgramId" class="form-select" required></select>
        </div>

        <!-- Course -->
        <div class="col-md-6 mb-3">
            <label class="form-label">Course</label>
            <select id="courseId" class="form-select" required></select>
        </div>
        </div>

        <div class="row">
        <div class="col-md-3 mb-3">
            <label>Semester</label>
            <input type="number" id="semester" class="form-control" required>
        </div>

        <div class="col-md-3 mb-3">
            <label>Year</label>
            <input type="number" id="year" class="form-control" required>
        </div>

        <div class="col-md-3 mb-3">
            <label>Credits</label>
            <input type="number" id="credits" class="form-control" required>
        </div>

        <div class="col-md-3 mb-3">
            <label>Required</label>
            <select id="isRequired" class="form-select">
            <option value="true">Bắt buộc</option>
            <option value="false">Tự chọn</option>
            </select>
        </div>
        </div>

        <button class="btn btn-success w-100">➕ Thêm</button>
    </form>
    </div>

    <div class="container mt-4">
    <table class="table table-bordered table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Program</th>
            <th>Course</th>
            <th>Semester</th>
            <th>Year</th>
            <th>Credits</th>
            <th>Type</th>
        </tr>
        </thead>
        <tbody id="tpcTable"></tbody>
    </table>
    </div>
    <script src="/js/training_program_courses.js"></script>
</body>
</html>
