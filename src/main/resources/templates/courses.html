<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý học phần</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script defer src="/js/courses.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4 text-primary">📘 Quản lý học phần</h2>

    <!-- ALERT -->
    <div id="alertBox"></div>

    <!-- FORM -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form id="courseForm" class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Mã môn</label>
                    <input type="text" id="course_code" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Tên môn</label>
                    <input type="text" id="course_name" class="form-control" required>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Tín chỉ</label>
                    <input type="number" id="credits" class="form-control" required min="1">
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-success w-100">
                        ➕ Thêm
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- TABLE -->
    <div class="card shadow-sm">
        <div class="card-body">

            <table class="table table-bordered table-hover text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Mã</th>
                        <th>Tên môn</th>
                        <th>Tín chỉ</th>
                        <th>Hành động</th>
                    </tr>
                </thead>

                <tbody id="courseTable"></tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
