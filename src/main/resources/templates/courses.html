<!DOCTYPE html>
<html>
<head>
    <title>Courses</title>
    <script src="/js/courses.js"></script>
</head>
<body>
    <h1>Danh sách học phần</h1>

    <form id="courseForm">
        <input type="text" id="course_code" placeholder="Mã môn">
        <input type="text" id="course_name" placeholder="Tên môn">
        <input type="number" id="credits" placeholder="Số tín chỉ">
        <button type="submit">Thêm</button>
    </form>

    <table border="1">
        <tbody id="courseTable"></tbody>
    </table>
</body>
</html>
