<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý chương trình đào tạo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script defer src="/js/training_programs.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4 text-primary">📚 Quản lý CTĐT</h2>

    <!-- ALERT -->
    <div id="alertBox"></div>

    <!-- FORM -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form id="programForm" class="row g-3">

                <div class="col-md-3">
                    <label class="form-label">Mã CTĐT</label>
                    <input type="text" id="program_code" class="form-control" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Tên CTĐT</label>
                    <input type="text" id="program_name" class="form-control" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Ngành</label>
                    <select id="major_id" class="form-select" required></select>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Tổng tín chỉ</label>
                    <input type="number" id="total_credits" class="form-control">
                </div>

                <div class="col-md-1 d-flex align-items-end">
                    <button class="btn btn-success w-100">
                        ➕
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- TABLE -->
    <div class="card shadow-sm">
        <div class="card-body">

            <table class="table table-bordered table-hover text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Mã</th>
                        <th>Tên CTĐT</th>
                        <th>Tín chỉ</th>
                        <th>Hành động</th>
                    </tr>
                </thead>

                <tbody id="programTable"></tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
